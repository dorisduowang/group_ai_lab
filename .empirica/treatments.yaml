factors:
    - name: fullInfo
      desc: Do participants have full information about the options?
      values:
        - value: true
        - value: false
    - name: hiddenInfoCue
      desc: Are the participants shown a cue about different players having different information?
      values:
        - value: true
        - value: false
    - name: introDuration
      desc: Duration of the introduction chat stage, in minutes
      values:
        - value: 1
    - name: gameDuration
      desc: Duration of the game in minutes
      values:
        - value: 10
    - name: playerCount
      desc: playerCount determines the number of Players are in a Game.
      values:
        - value: 5
treatments:
    - name: noFacilitator_noCue
      factors:
        gameDuration: 10
        fullInfo: false
        hiddenInfoCue: false
        introDuration: 1
        playerCount: 5
    - name: noFacilitator_withCue
      factors:
        gameDuration: 10
        fullInfo: false
        hiddenInfoCue: true
        introDuration: 1
        playerCount: 5
