name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Empirica dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server
      - name: Test no-facilitator agent protocol
        run: npm test --prefix agent_runner
      - name: Test GRAIL comparison
        run: python -m unittest discover -s analysis -p 'test_*.py' -v
      - name: Build Empirica client
        run: npm run build --prefix client
      - name: Build Empirica server
        run: npm run build --prefix server
